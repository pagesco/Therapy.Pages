
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Product Details | Therapy Pages</title>
<link rel="icon" type="image/png" href="ICON.png">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink:#e75491;
  --deep-pink:#b83270;
  --pale-pink:#fff0f6;
  --cream:#fffafc;
  --text:#49333e;
  --border:#f1d4e2;
}

* {box-sizing:border-box;}

body {
  margin:0;
  font-family:'Playfair Display',serif;
  color:var(--text);
  background:linear-gradient(135deg,#fff0f6,#fffafc);
}

header {
  padding:22px 6%;
  background:white;
  border-bottom:1px solid var(--border);
}

.logo {
  color:var(--deep-pink);
  font:40px 'Allura',cursive;
}

main {
  width:min(1000px,90%);
  margin:55px auto;
}

.back-link {
  display:inline-block;
  margin-bottom:25px;
  color:var(--deep-pink);
  text-decoration:none;
  font-family:'Poppins',sans-serif;
}

.product-box {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:40px;
  padding:35px;
  background:white;
  border:1px solid var(--border);
  border-radius:24px;
}

.product-image {
  width:100%;
  max-height:480px;
  object-fit:contain;
  border-radius:18px;
  background:var(--pale-pink);
}

.product-info {
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.category {
  color:var(--deep-pink);
  font:12px 'Poppins',sans-serif;
  text-transform:uppercase;
  letter-spacing:2px;
}

h1 {
  font-size:32px;
  margin:12px 0;
}

.price {
  color:var(--deep-pink);
  font-size:25px;
  font-weight:bold;
  margin:10px 0 20px;
}

.description {
  line-height:1.8;
  color:#715b65;
}

.quantity {
  display:flex;
  align-items:center;
  gap:15px;
  margin:25px 0;
  font-family:'Poppins',sans-serif;
}

.quantity input {
  width:75px;
  padding:10px;
  border:1px solid var(--border);
  border-radius:10px;
}

.add-button {
  padding:15px;
  border:0;
  border-radius:12px;
  background:var(--deep-pink);
  color:white;
  font:500 15px 'Poppins',sans-serif;
}

.add-button:hover {
  background:var(--pink);
}

.message {
  margin-top:15px;
  color:var(--deep-pink);
  font-family:'Poppins',sans-serif;
  font-size:13px;
}

@media(max-width:700px) {
  main {margin:30px auto;}
  .product-box {
    grid-template-columns:1fr;
    padding:20px;
    gap:25px;
  }
  h1 {font-size:27px;}
}
</style>
</head>

<body>

<header>
  <div class="logo">Therapy Pages ♡</div>
</header>

<main>
  <a class="back-link" href="index.html#kids">← Back to Products</a>

  <section class="product-box">
    <div>
      <img id="productImage" class="product-image" src="" alt="Product image">
    </div>

    <div class="product-info">
      <div class="category" id="productCategory"></div>
      <h1 id="productName">Loading product...</h1>
      <div class="price" id="productPrice"></div>
      <p class="description" id="productDescription"></p>

      <div class="quantity">
        <label for="quantity">Quantity:</label>
        <input type="number" id="quantity" value="1" min="1">
      </div>

      <button class="add-button" id="addToCartButton">
        Add to Cart ♡
      </button>

     <div class="message" id="message"></div>

    <div id="cartActions" style="display:none; gap:12px; margin-top:15px; flex-wrap:wrap;">
    
      <a href="index.html#kids" style="text-decoration:none; text-align:center; padding:13px 18px; border:1px solid #b83270; border-radius:12px; color:#b83270; font-family:'Poppins',sans-serif;">
        Continue Shopping
      </a>
    
      <a href="index.html#cart" style="text-decoration:none; text-align:center; padding:13px 18px; background:#b83270; border-radius:12px; color:white; font-family:'Poppins',sans-serif;">
        View My Cart
      </a>
    
    </div>
  </section>
</main>

  
<script>
const products = [
  {
    id: 1,
    name: "Boys' Coloring Book",
    category: "Kids",
    price: 3500,
    description: "Designed especially for little boys, this coloring book encourages creativity, imagination and self-expression through fun and engaging illustrations. It helps develop fine motor skills, improve focus and concentration, build confidence and give boys a fun way to explore their interests while learning through play.",
    image: "boys book cover.jpeg"
  },
  {
    id: 2,
    name: "Girls' Coloring Book",
    category: "Kids",
    price: 3500,
    description: "A creative space for little girls to explore their imagination and express themselves through coloring. It encourages creativity, improves concentration and fine motor skills, while providing a fun and enjoyable activity.",
    image: "girls book cover.jpeg"
  },
  {
    id: 3,
    name: "Workbook (Age Range: 2-5)",
    category: "Kids",
    price: 4000,
    description: "A fun and interactive workbook designed to make learning enjoyable. It helps children build early learning skills through activities that encourage letter and number recognition, problem-solving, hand-eye coordination and independent thinking.",
    image: "Workbook Cover.png"
  },
  {
    id: 4,
    name: "Adult Coloring Book",
    category: "Adults",
    price: 5000,
    description: "A relaxing creative escape designed to help adults slow down, unwind and take a break from everyday stress. Coloring encourages mindfulness, supports relaxation and provides an opportunity to express creativity while enjoying some well-deserved me-time.",
    image: "adult binding.png"
  },
  {
    id: 5,
    name: "Jamaican Edition",
    category: "Adults",
    price: null,
    description: "Celebrate the beauty, culture, and vibrant spirit of Jamaica through a special coloring collection!",
    image: "comingsoon.jpg"
  },
  {
    id: 6,
    name: "Schoolas Editon",
    category: "Adults",
    price: null,
    description: "A fun and creative collection inspired by school life, learning, and everyday classroom adventures!",
    image: "comingsoon.jpg"
  }
];

const productId = Number(
  new URLSearchParams(window.location.search).get("id")
);

const product = products.find(item => item.id === productId);

if (product) {
  document.getElementById("productImage").src = product.image;
  document.getElementById("productImage").alt = product.name;
  document.getElementById("productCategory").textContent =
    product.category + " Collection";

  document.getElementById("productName").textContent = product.name;

  document.getElementById("productPrice").textContent =
    product.price === null
      ? "Coming Soon"
      : "J$" + product.price.toLocaleString("en-JM");

  document.getElementById("productDescription").textContent =
    product.description;

  if (product.price === null) {
    document.getElementById("addToCartButton").disabled = true;
    document.getElementById("addToCartButton").textContent = "Coming Soon";
  }
} else {
  document.getElementById("productName").textContent =
    "Product not found";

  document.getElementById("productDescription").textContent =
    "Please return to our collection and select a product.";
  document.getElementById("addToCartButton").disabled = true;
}

  document.getElementById("addToCartButton").addEventListener("click", function() {
  if (!product || product.price === null) return;

  const quantity = Number(document.getElementById("quantity").value);

  if (!Number.isInteger(quantity) || quantity < 1) {
    document.getElementById("message").textContent =
      "Please enter a valid quantity.";
    return;
  }

  let cart = JSON.parse(localStorage.getItem("therapyPagesCart") || "[]");

  const existingItem = cart.find(item => item.id === product.id);

  if (existingItem) {
    existingItem.quantity += quantity;
  } else {
    cart.push({
      ...product,
      quantity: quantity
    });
  }

  localStorage.setItem("therapyPagesCart", JSON.stringify(cart));

  document.getElementById("message").textContent =
    "💗 Added to your cart! Good Choice!";
    document.getElementById("cartActions").style.display = "flex";
});
</script>

</body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Checkout | Therapy Pages</title>
<link rel="icon" type="image/png" href="ICON.png">

<link href="https://fonts.googleapis.com/css2?family=Allura&family=Playfair+Display:wght@400;500;600;700&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
:root {
  --pink: #e75491;
  --deep-pink: #b83270;
  --pale-pink: #fff0f6;
  --cream: #fffafc;
  --text: #49333e;
  --border: #f1d4e2;
}

* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Playfair Display', serif;
  color: var(--text);
  background: linear-gradient(135deg, #fff0f6, #ffe0ed, #fff7fa);
}

header {
  background: var(--cream);
  padding: 20px;
  text-align: center;
  border-bottom: 1px solid var(--border);
}

header a {
  color: var(--deep-pink);
  text-decoration: none;
  font-family: 'Allura', cursive;
  font-size: 38px;
}

.container {
  max-width: 850px;
  margin: 35px auto;
  padding: 25px;
}

h1 {
  text-align: center;
  color: var(--deep-pink);
}

.checkout-card {
  background: white;
  padding: 25px;
  border-radius: 18px;
  box-shadow: 0 5px 20px rgba(184, 50, 112, 0.08);
}

footer {
  text-align: center;
  padding: 25px;
  color: var(--deep-pink);
}
</style>
</head>

<body>

<header>
  <a href="index.html">Therapy Pages ♡</a>
</header>

<main class="container">

  <h1>Checkout ♡</h1>

  <p style="text-align:center;">

  </p>

  <div class="checkout-card">

    <h2>Complete Your Order</h2>

    <p>Your checkout details will appear here.</p>

  </div>

</main>

<footer>
  Heal | Grow | Thrive ♡
</footer>
